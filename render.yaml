services:
  - type: web
    name: leadflow-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build:prod
    startCommand: npm run migrate:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
